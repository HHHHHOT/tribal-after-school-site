<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>《Beat之間》｜線上閱讀</title>

  <meta
    name="description"
    content="《Beat之間》第一篇＋第二篇線上閱讀"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .topbar {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 20px;
      background: #111;
      border-bottom: 1px solid #333;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 2;
    }

    .title-group {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .book-mark {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 50% 42% 48% 45%;
      background: #e55e42;
      color: #fff;
      font-size: 21px;
      font-weight: 900;
      transform: rotate(-5deg);
    }

    .title {
      margin: 0;
      overflow: hidden;
      color: #fff;
      font-size: clamp(16px, 2.5vw, 22px);
      font-weight: 700;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .subtitle {
      margin: 3px 0 0;
      color: #aaa;
      font-size: 13px;
    }

    .open-btn {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 8px 14px;
      border: 1px solid #666;
      border-radius: 10px;
      background: transparent;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition:
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .open-btn:hover {
      background: #e55e42;
      border-color: #e55e42;
    }

    .open-btn:focus-visible {
      outline: 3px solid #ff9a84;
      outline-offset: 3px;
    }

    .viewer-container {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: #222;
    }

    .fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 8px;
      padding: 24px;
      color: #fff;
      text-align: center;
    }

    .fallback strong {
      font-size: 18px;
    }

    .fallback span {
      color: #aaa;
      line-height: 1.6;
    }

    .fallback a {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      justify-self: center;
      margin-top: 8px;
      padding: 8px 14px;
      border-radius: 10px;
      background: #e55e42;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    .viewer {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    @media (max-width: 560px) {
      .topbar {
        min-height: 60px;
        gap: 8px;
        padding: 8px 10px;
      }

      .book-mark {
        width: 38px;
        height: 38px;
      }

      .subtitle {
        display: none;
      }

      .open-btn {
        padding-right: 10px;
        padding-left: 10px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="title-group">
      <div class="book-mark" aria-hidden="true">B</div>

      <div>
        <h1 class="title">《Beat之間》</h1>
        <p class="subtitle">第一篇＋第二篇</p>
      </div>
    </div>

    <a
      class="open-btn"
      href="index.pdf"
      target="_blank"
      rel="noopener noreferrer"
    >
      開啟完整 PDF
    </a>
  </header>

  <main class="viewer-container">
    <div class="fallback">
      <strong>正在載入漫畫閱讀器</strong>

      <span>
        如果漫畫沒有自動顯示，請點右上角「開啟完整 PDF」。
      </span>

      <a
        href="index.pdf"
        target="_blank"
        rel="noopener noreferrer"
      >
        直接開啟 PDF
      </a>
    </div>

    <iframe
      class="viewer"
      src="index.pdf#view=FitH"
      title="《Beat之間》漫畫閱讀器"
    ></iframe>
  </main>
</body>
</html>
