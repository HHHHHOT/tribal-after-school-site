function cultureNoteHTML(){return `<div class="culture-layout"><section><div class="culture-heading">成為靈媒的三項要件</div><div class="culture-requirements"><div class="req-chip"><i>01</i>女性</div><div class="req-chip"><i>02</i>具有家學淵源</div><div class="req-chip"><i>03</i>通過儀禮</div></div></section><section class="culture-principle"><div class="culture-heading">傳承原則</div>以同系之人為主，並盡可能維持在母系範圍內。老靈媒不能任意指定徒弟，仍須等待神兆指引。</section><div class="culture-grid"><article class="culture-card"><h3><span class="num">1</span>師徒相授</h3><p>族人相信神靈會安排適任者，因此靈媒不主動尋找徒弟。願意學習者仍需憑文化認同、誠心與毅力接受長期考驗。</p></article><article class="culture-card"><h3><span class="num">2</span>世襲傳授</h3><p>具有家傳、近親祖先曾為靈媒，或出自貴族體系者，可能具備 <span class="term">katje luqeman（先天靈力）</span>，並較容易接受來自 <span class="term">i vavau（上面／神靈間）</span>、<span class="term">i kacauwan（人間）</span> 與 <span class="term">i sangas（前方）</span> 的 <span class="term">semaugeseg（指引）</span>。</p></article><article class="culture-card"><h3><span class="num">3</span>神靈授予</h3><p>內在徵兆包括 <span class="term">luqem（神力／靈力）</span>、<span class="term">puqenetjan（慧根）</span>、<span class="term">kemauvaudjan（被揀選之人）</span>、記憶力與口才；外在則以 <span class="term">zaqu（靈珠）</span> 為重要徵兆。</p></article></div><div class="culture-conclusion"><b>資格認定</b>　最終仍須獲得神靈認可並通過儀禮，才算真正承接 <span class="term">pulingaw（靈媒）</span> 的職責。</div></div>`}
function trainingNoteHTML(){return `<div class="culture-layout"><div class="training-grid"><article class="training-card"><h3>經語與祭歌的特性</h3><p>靈媒使用的經語繁複、有序且結構嚴謹，可用於向神靈請益、贖罪及入神等祭儀目的。經文由艱澀的古排灣語構成，與日常溝通族語有明顯差異。</p></article><article class="training-card"><h3>師徒訓練範圍</h3><p>學習內容包含 <span class="term">tjaucikel（口述傳說）</span>、<span class="term">milimilingan（神話故事）</span>、<span class="term">lada（經語）</span>、<span class="term">kakudanan（文化習俗）</span>，以及空間方位、自然法則、地理知識和各類神靈的形象、特徵及職責。</p></article><article class="training-card wide"><h3>消除語障儀式</h3><p>初學者能輕吟基礎經文後，師父會執行消除語障儀式，協助學習者不因古語艱澀而退縮。其目的在排除語言障礙、使經文與祭歌背誦更加順遂；完成後仍須繼續學程。</p></article><article class="training-card wide"><h3>祭儀實作順序</h3><div class="practice-flow"><div class="practice-step"><span class="term">pucevulj</span><br>（迎祖靈）</div><div class="practice-arrow">→</div><div class="practice-step"><span class="term">djemuljat</span><br>（刺福球）</div><div class="practice-arrow">→</div><div class="practice-step"><span class="term">pakisuwai</span><br>（娛靈刺球活動）</div><div class="practice-arrow">→</div><div class="practice-step"><span class="term">pusau ta qaqetitan／kavuvuan</span><br>（送祖靈）</div></div></article></div><div class="culture-conclusion"><b>完整能力</b>　靈媒不只背誦經文，也必須能理解文化、自然、地理、神靈系統與各項祭祀活動。</div></div>`}

function renderSpelling(){const word=WORDS[W.order[W.pos]][0],letters=[...word],candidates=letters.map((c,i)=>/[A-Za-z]/.test(c)?i:-1).filter(i=>i>=0),missing=candidates.filter((_,i)=>(i+W.pos)%3===1);while(missing.length<Math.min(2,candidates.length))missing.push(candidates[missing.length]);W.missing=[...new Set(missing)];document.getElementById("wordProgress").textContent=`第 ${W.pos+1}／${WORDS.length} 題　得分 ${W.score}`;document.getElementById("wordTerm").textContent=WORDS[W.order[W.pos]][1];document.getElementById("wordHint").textContent="依照中文提示，填入缺少的字母";document.getElementById("wordOptions").innerHTML=`<div class="spell-line">${letters.map((c,i)=>W.missing.includes(i)?`<input class="spell-input" maxlength="1" data-answer="${c.toLowerCase()}" oninput="moveSpell(this)">`:`<span class="spell-char">${c===" "?"&nbsp;":c}</span>`).join("")}</div>`;document.getElementById("wordFeedback").textContent="";document.getElementById("wordNext").textContent="確認答案";document.getElementById("wordNext").hidden=false;W.locked=false;setTimeout(()=>document.querySelector(".spell-input")?.focus(),0)}
function moveSpell(el){el.value=el.value.slice(-1);if(el.value)el.nextElementSibling?.matches(".spell-input")&&el.nextElementSibling.focus()}
function checkSpelling(){const inputs=[...document.querySelectorAll(".spell-input")];let ok=true;inputs.forEach(el=>{const good=el.value.toLowerCase()===el.dataset.answer;el.classList.add(good?"correct":"wrong");el.disabled=true;if(!good)ok=false});if(ok)W.score++;W.locked=true;const word=WORDS[W.order[W.pos]][0];document.getElementById("wordFeedback").innerHTML=ok?"拼字正確！":`正確拼法：<b>${word}</b>`;showPracticeNext()}

 const roots=[174.61,196,220,196,174.61,220,196,261.63],ratios=[1,9/8,5/4,4/3,3/2,5/3,2],section=Math.floor(step/8)%4,root=roots[(step+section*3)%roots.length],now=audioCtx.currentTime;

}
function playWarmDrone(f,when,dur,level){[1,1.5,2].forEach((r,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),lp=audioCtx.createBiquadFilter();o.type=i?"sine":"triangle";o.frequency.value=f*r;o.detune.value=i===1?4:-3;lp.type="lowpass";lp.frequency.value=520;g.gain.setValueAtTime(.001,when);g.gain.exponentialRampToValueAtTime(level/(i+1),when+.22);g.gain.exponentialRampToValueAtTime(.001,when+dur);o.connect(lp).connect(g).connect(master);o.start(when);o.stop(when+dur+.05)})}

function playWordlessVoice(f,when,dur,level){const bus=audioCtx.createGain(),formant=audioCtx.createBiquadFilter();formant.type="bandpass";formant.frequency.value=760;formant.Q.value=.75;bus.gain.setValueAtTime(.001,when);bus.gain.linearRampToValueAtTime(level,when+.3);bus.gain.setValueAtTime(level,when+Math.max(.31,dur-.38));bus.gain.exponentialRampToValueAtTime(.001,when+dur);[1,1.002,2].forEach((r,i)=>{const o=audioCtx.createOscillator();o.type=i===2?"sine":"triangle";o.frequency.value=f*r;o.detune.value=i?5:-4;o.connect(formant);o.start(when);o.stop(when+dur+.03)});formant.connect(bus).connect(master);bus.connect(echoBus)}
